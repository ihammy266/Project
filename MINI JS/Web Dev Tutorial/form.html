<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body {
            background-color: skyblue;

        }

        .container {
            width: 95%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
           
        }

        .message {
            width: 500px;
            height: auto;
            display: flex;
            flex-direction: column;
            background-color: whitesmoke;
            border-radius: 5px;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3);
        }


        #name {

            border: 2px solid rgb(225, 223, 223);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 12px;
            margin-right: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-bottom: 0cap;
            border-left: 0cap;
            border-right: 0cap;
            padding-left: 6px;
            padding-top: 8px;

        }

        #input {
            width: 400px;
            height: 30px;
            border-radius: 3px;
            border-color: white;
            border: none;

        }

        h3 {
            font-size:1.4rem;
            font-weight: 600;
            text-align: center;
        }

        label {
            color: rgb(18, 16, 16);
            margin-bottom: 4px;
            font-size: 1rem;
        }

        #submit {
            font-size: 1rem;
            padding: 6px;
           background-color: rgb(239, 238, 238);
           border: none;
             margin-left: 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        p {
            text-align: center;
            font-size: larger;
            text-transform: uppercase;
        }

        .img-button{
            display: inline-block;
            padding: 7px 9px 11.5px 10px;
            margin-right: -8px;
            border: 1px solid gray;
            border: none;
            
        }

        @media(max-width:480px) {
            .message{
             width : 340px;
            }
            #input{
                width: 180px;
            }
         
            h3 {
                font-size: 1rem;
            }
     
           #submit {
            font-size: 0.8rem;
           }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="message">
            <div>
                <h3>Pass the message</h3>
                <div id="name"> 
                    <label for="Enter a message">
                        Enter a message
                    </label> 
                    <div>
                  <input type="text" id="input">  
                    </div>
                </div>
                <button id="submit">Submit</button>
                <p id="demo"></p>
                
            </div>
        </div>


    </div>

    <script>
        function enterMessage() {
        const input = document.querySelector('#input');
        const SubmitValue = input.value;
        document.getElementById('demo').innerHTML = SubmitValue;
        input.value = '';
        }
        document.querySelector('#submit'). addEventListener('click', () => {
          enterMessage();
        });
        
           document.getElementsByTagName('body')[0].addEventListener('keydown', (event) => {
            if  (event.key === 'Enter') {
               enterMessage();
            }
         
           });
    </script>
</body>

</html>
