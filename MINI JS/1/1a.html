<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <style>
        #green-button {
            background-color: green;
        }

        #red-button {
            background-color: red;
        }

        #blue-button {
            background-color: blue;
        }

        #random {
            background-color: grey;
        }

        button {
            padding: 30px;
            border: none;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: larger;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <h1>Color Flipper</h1>
    <button id="green-button" onclick="setColor('green');">Green</button>
    <button id="red-button" onclick="setColor('red');">Red</button>
    <button id="blue-button" onclick="setColor('blue');">Blue</button>
    <button id="random" onclick="chooseRandomColor() ;">random</button>

    <script src="1a.js"></script>
</body>

</html>
