<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="calculators">
        <input id="display" readonly>
        <div class="keys">
            <div class="clear-keys">
                <button class="p-keys" onclick="clearDisplay()">C</button>
                <button class="p-keys" onclick="appendToDisplay('+/-')">+/-</button>
                <button class="p-keys" onclick="percetageDisplay('%')">%</button>
                <button class="use-keys" onclick="appendToDisplay('/')">/</button>
            </div>
            <div class="multiply-keys">
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button class="use-keys" onclick="appendToDisplay('*')">*</button>
            </div>
            <div class="subtract-keys">
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button class="use-keys" onclick="appendToDisplay('-')">-</button>
            </div>

            <div class="add-keys">
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button class="use-keys" onclick="appendToDisplay('+')">+</button>
            </div>

            <div class="final-keys">
                <button class="n-keys"  onclick="appendToDisplay('0')">0</button>
                <button onclick="appendToDisplay('.')">.</button>
                <button class="use-keys" onclick="calculate()">=</button>
            </div>

        </div>
    </div>
  <script src="index.js"></script>

</body>

</html>
