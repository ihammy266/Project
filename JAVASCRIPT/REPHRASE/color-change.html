<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Change Color</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Roboto:ital,wght@0,500;1,500&display=swap');


        body {
            margin-top: 50px;
            font-family: "Comfortaa", sans-serif;
            font-optical-sizing: auto;
            font-weight: 600;
            font-style: normal;
        }


        .container h1 {
            padding-bottom: 30px;
            font-size: 2rem;
        }

        .container h2 {}

        .container {
            width: 95%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            padding-top: 10px;
        }

        .hex-code {

            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hex-code">
            <h1>CLICK THE BUTTON BELOW TO DISPLAY THE HEX CODE OF A RANDOM COLOR </h1>
            <h2 id="hex-code">The hex code of the color is #00000</h2>
            <button onclick="changeColor();"         type="button" class="btn btn-primary">Click Me</button>
        </div>
    </div>

    <script>
       
  
 function changeColor() {
     const hexNumbers = ['1','2','3','4','5','6','7','8','9','A','B','C','D','F'];
      let hexCode = '';
    for (let i = 0 ; i < 6 ; i++) {
        const randomIndex = Math.floor(Math.random() * hexNumbers.length);
        hexCode += hexNumbers[randomIndex];
    }

    document.getElementById('hex-code').innerHTML = `The hex code of the color is 
    #${hexCode} `;
    document.getElementsByTagName('body')[0].style.backgroundColor = '#' + hexCode;
 }


    </script>

</body>

</html>
