    <title>Rock Paper Scissors</title>
</head>
<body>
     <h1>Rock Paper Scissors</h1>
    <button> <img src="../styles/icons/rock-emoji.png" class="rock-button" >

    <button id="Reset" onclick="
      resetScore();
        ">Reset Score</button>

    </script>
