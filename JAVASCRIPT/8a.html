<body>
      <h1>Hello Objects</h1>

  <button onclick="
   
  playerGame('heads');
 

   
  ">Heads</button>
  <button
  onclick="
    playerGame('tails');
  ">tails</button>

  
    <script>

        let score = JSON.parse(localStorage.getItem('score')) || {
        wins : 0,
        losses : 0,
  }
        function playerGame(guess) {
          const computerMove = pickComputerMove();
           
      let result = '';
      
       if (computerMove === guess) {
         result = 'You win.';

      } else {
        result = 'You lose.';
      }
     
      if (computerMove === guess) {
        score.wins++;
      } else {
        score.losses++;
      }
      

    alert(`You guessed  ${guess}. Computer chose ${computerMove}. ${result}  \n Wins :${score.wins}, Losses:${score.losses}`);
     
      localStorage.setItem('score', JSON.stringify(score) );
      
        }
        function pickComputerMove() {
         const randomNumber = Math.random();
      let computerMove = '';
      if (randomNumber >= 0 && randomNumber < 0.5) {
         computerMove = 'heads';
      } else if(randomNumber >= 0.5 && randomNumber <= 1) {
        computerMove = 'tails';
      }

      return computerMove;
        }


        


    </script>
