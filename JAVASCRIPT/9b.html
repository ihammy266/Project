<body>
  <p>YOUTUBE SUBSCRIBE BUTTON</p>
  <button class = "subscribe-button" onclick="subscribe()"
  >Subscribe</button>

 
  <p>Amazon Shippiing Calculator
  </p>
  <p>Order under $40 = +$10 Shippiing</p>
  <p>Order over $40 = FREE Shippinng</p>
  <div>
     <input class="search-bar" type="text" id="orderCost" placeholder="Cost of Order">
    <button id="calculate-button"     onclick="calculateTotal();
   
    ">Calculate</button>
     <p id="result"></p>
  </div>
     <p>Rock Paper Scissors</p>
  <a href="9c.html" target="_blank">Click here</a>
  <script>
       
      function subscribe() {
  const button = document.querySelector(".subscribe-button");

  if (button.textContent === "Subscribe") {
    button.textContent = "Subscribed";
    button.classList.add("is-subscribed");
  } else  {
    button.textContent = "Subscribe";
     button.classList.remove("is-subscribed");
  }
}
    
    
   function calculateTotal() {
    let orderCost = Number(document.getElementById("orderCost").value);
    let totalCost;

    if (orderCost >= 40) {
        totalCost = orderCost;
    } else {
        totalCost = orderCost + 10;
    }

    document.getElementById("result").textContent =
        `Total Cost: $${totalCost}`;
}

</script>

</body>
