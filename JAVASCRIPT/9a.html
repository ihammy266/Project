<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>

</head>
 <style>
  button {
    font-size: larger;
  }
  p {
    font-size: larger;
  }
 </style>
<body>
   <p>Rock Paper Scissors</p>
    <button onclick="
   playerGame('Rock');
    ">Rock</button>
    <button onclick="
      
   playerGame('Paper');
       
    ">Paper</button>
    <button onclick="
   playerGame('Scissors');
       
    ">Scissors</button>
       <p id="result"></p>
       <p id="js-moves"></p>
    <p onclick="playerGame()" id="score">Wins:0 , Losses :0, Tie:0</p>
  
    <button onclick="
      resetScore();
        ">Reset Score</button>
        

   <script>
        let score = {
        wins: 0,
        losses: 0,
        ties : 0

    }
        function playerGame(playerMove) {
            const computerMove = pickComputerMove();

            let result = '';
            if (playerMove === 'Scissors') {
                if (computerMove === 'rock') {
                    result = 'You lose.';
                } else if (computerMove === 'Paper') {
                    result = 'You win.';
                } else if (computerMove === 'Scissors') {
                    result = 'Tie.';
                }

            } else if (playerMove === 'Paper') {
                if (computerMove === 'rock') {
                    result = 'You win';
                } else if (computerMove === 'Paper') {
                    result = 'Tie.';
                } else if (computerMove === 'Scissors') {
                    result = 'You lose.';
                }
            } else if (playerMove === 'Rock') {
                if (computerMove === 'Rock') {
                    result = 'Tie.';
                } else if (computerMove === 'Paper') {
                    result = 'You lose.';
                } else if (computerMove === 'Scissors') {
                    result = 'You win.';
                }
            }
   

            if(result === 'You win.') {
                score.wins++; 
            } else if (result === 'You lose.') {
               score.losses++;
            } else if (result === 'Tie.') {
             score.ties++;
            }
           document.getElementById('score').textContent = `Wins:${score.wins}, Losses:${score.losses}, Ties: ${score.ties}` ;
            document.getElementById("result").textContent =`${result} `;
           document.getElementById('js-moves').textContent = `You ${playerMove} - ${computerMove} Computer.`;

               function resetScore() {
        score = {
            wins:0,
            losses:0,
            ties:0
        };
    }
        }


        function pickComputerMove() {
            const randomNumber = Math.random();
            let computerMove = '';
            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'Paper';
            } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'Scissors';
            }

            return computerMove;
        }

    
   </script>
</body>

</html>
