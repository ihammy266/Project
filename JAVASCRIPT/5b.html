<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Mini Calculator</title>

    <style>
        button {
            padding: 8px 5px 8px 5px;
            font-size: medium;
        }
        
    </style>
</head>
<body>
     <p id="number"></p>
    <button onclick="
     updateCalculation('1');
    ">1</button>
    <button onclick="
        updateCalculation('2');
    ">2</button>
    <button onclick="
    updateCalculation('3');
    ">3</button>
    <button onclick="
    updateCalculation('+');
    ">+</button>
    <button onclick=" updateCalculation('4');">4</button>
    <button onclick=" updateCalculation('5');">5</button>
    <button onclick=" updateCalculation('6');">6</button>
    <button onclick=" updateCalculation('-');">-</button>

    <button onclick=" updateCalculation('7');">7</button>
    <button onclick=" updateCalculation('8');">8</button>
    <button onclick=" updateCalculation('9');">9</button>
    <button onclick=" updateCalculation('*');">*</button>

    <button onclick="
     resetCalculator();
    ">Clear</button>
    <button onclick="
    calculation = eval(calculation);
    displayCalculation();
     localStorage.setItem('calculation', calculation);
    "
    >=</button>
    <button onclick=" updateCalculation('4')">/</button>
    <button onclick=" updateCalculation('4')">.</button>
    <script>
   

     let calculation =  localStorage.getItem('calculation') ||"";
        function updateCalculation (Number) {
          calculation += Number;
          localStorage.setItem('calculation', calculation);
          displayCalculation();
        }

        function displayCalculation () {
          document.getElementById('number').innerHTML=calculation;
        }


        function resetCalculator () {
            calculation ='';
           displayCalculation();
             localStorage.setItem('calculation', calculation);
        }
     


 










       
    </script>
</body>
</html>
