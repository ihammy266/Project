<!DOCTYPE html>
<html>

<head>
    <title>Cart Quantity</title>


    <style>
        button {
            padding: 8px 5px 8px 5px;
            font-size: medium;
        }

        p {
            font-size: large;
        }
    </style>
</head>

<body>
    <button onclick="showQuantity();">Show Quantity</button>
    <p id='show-quantity'></p>
    <button onclick="
   updateCartQuantity(1);
    ">Add to Cart</button>

    <button onclick="
    updateCartQuantity(2);
     ">+2</button>

    <button onclick="
    updateCartQuantity(3);
    ">+ 3
    </button>

    <button onclick="
    updateCartQuantity(4);
    ">+4</button>

    <button onclick="
   updateCartQuantity(5);
    ">+5</button>

    <button onclick="
  updateCartQuantity(-1);
    ">Remove from Cart</button>

    <button onclick="
      resetCart();
    ">Reset Cart</button>


    <script>
        let cartQuantity = 0;
        function updateCartQuantity(quantity) {
             if (cartQuantity + quantity > 10) {
          alert('The cart is full');
          return;
        }

        if (cartQuantity + quantity < 0) {
          alert('Not enough items in the cart');
          return;
        }
        cartQuantity+= quantity;
        }
        function resetCart() {
            cartQuantity = 0;
        }
        function showQuantity() {
            document.querySelector('#show-quantity').innerHTML =
                `Cart Quantity:${cartQuantity}`;
        }
    </script>
</body>

</html>
