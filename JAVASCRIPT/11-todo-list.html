<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>

    <style>
     
  #input {
    padding: 6px;
    color: rgb(110, 109, 109);
    border:2px solid rgb(95, 94, 94);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
    
    
  }
  #date {
    padding: 6px;
    color: rgb(110, 109, 109);
    border:2px solid rgb(95, 94, 94);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
  
  }
      .js-grid,
      .body-grid {
        display: grid;
        grid-template-columns: 250px 200px 100px;
        column-gap: 10px;
        row-gap: 10px;
        align-items: center;
  }
   
  .delete-button {
    background-color: rgb(141, 18, 18);
    color: white;
    height: 40px;
    width: 140px;
    font-family: Arial, Helvetica, sans-serif;
    border: none;
    font-size: 20px;
  }
  .body-grid {
    align-items: center;
    margin-bottom: 10px;
  }
  div {
    font-size: larger;
  }
  .add-button {
    background-color : rgb(18, 166, 18);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
    height: 40px;
    width: 140px;
    border: none;
   
  }
    </style>
</head>
<body>
    <h1>Todo List Practice 1</h1>
    <div  class="body-grid">
          <input  id='input'   type="text" placeholder="Todo name">
           <input type="date" id="date";>
           <button class="add-button  js-add-button">Add</button> 
    </div>
    <div class="js-todo-list js-grid"></div>
    <p id="list"></p>
    <script src="11-todo-list.js">

    </script>
</body>
</html>
