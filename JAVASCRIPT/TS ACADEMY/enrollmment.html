<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Form</title>
</head>
<style>
    body {
        background-color: rgb(170, 187, 170);
    }
    #personal-info {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 20px;
    }

    #acc-info {
        display: flex;
        flex-direction: column;
        gap: 15px;
        display: block;
    }

    form {
        font-size: 30px;
        display: block;
        width: 100%;

    }

    input[type='text'],
    input[type='date'],
    input[type='email'],
    input[type='tel'],
    select,
    textarea {
        display: block;
        width: 400px;
        height: 50px;
        margin-bottom: 15px;
    }

    #radio label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
    }
    .buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
}

     input[type="submit"],
     input[type="reset"]{
     padding:12px 20px;
     cursor:pointer;
}

 input[type="file"]{
    display: block;
    margin-bottom: 20px;
}
 h1 {
    align-items: center;
 }
 input[type="file"]{
    font-size:16px;
}

input[type="file"]::file-selector-button{
    background:#007BFF;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    margin-right:15px;
}

input[type="file"]::file-selector-button:hover{
    background:#0056b3;
}
</style>

<body>
    <div id="entire-form">
        <h1>Student Enrollment Form
        </h1>

        <Form>
            <div id="personal-info">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="Full Name">Full name:</label>
                    <input type="text" required>
                    <label for="email">Email Address:</label>
                    <input type="email" required>
                    <label for="Tel">Phone Number:</label>
                    <input type="tel" required><br>
                    <label for="date">Date of Birth:</label>
                    <input type="date" required>
                    <div id="radio">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender" value="Others">
                            Others
                        </label>
                    </div>
                </fieldset>
            </div>


            <div id="acc-info">
                <fieldset>
                    <legend>Account Details</legend>
                    <label for="course">Choose a course:</label>
                    <select>
                        <optgroup label="Faculty of Arts">
                            <option value="law">Law</option>
                            <option value="theatre-arts">Theatre Arts</option>
                            <option value="mass-communication">Mass Communication</option>
                        </optgroup>
                    </select><br>
                    <label for="message">Write a message:</label>
                    <textarea name="message" rows="5" cols="40">Leave a message</textarea>
                    <label for="file">Upload your file</label>
                    <input type="file" id="file">
                    <label>
                        <input type="checkbox">
                        I agree to the terms and conditions.
                    </label>

                    <div class="buttons">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </div>
                </fieldset>

            </div>
        </Form>
    </div>



</body>

</html>
