    <button onclick="chooseMove('Heads');">Heads</button>
<button onclick="chooseMove('Tails');">Tails</button>

<input type="text" placeholder="Name" width="100%" height="60%">
<button onclick="getText();">Submit</button>
<p id="result"></p>

<p id="result"></p>

<script>
  function chooseMove(move) {
    document.getElementById('result').textContent = `You chose: ${move}`;
  }

  function getText () {
    let inputElement = document.querySelector('input');
    document.getElementById('result').textContent = `Your name is:${inputElement.value}`;
  }
</script>
