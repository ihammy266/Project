<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
 .game-button{
    background-color: rgb(240, 240, 240);
    font-family: Arial, Helvetica, sans-serif;
    padding: 25px;
    border: none;
    border-radius: 10px;
    font-size: large;
    font-weight: 600;

 }
 .is-toggled {
    background-color:rgb(11, 10, 10);
    color:white;
 }

 #calculate-button {
  padding-left: 20px;
  padding-right: 20px;
  padding-top: 13px;
  padding-bottom: 13px;
  background-color: rgb(7, 109, 7);
  color: white;
  font-size: 20px;

}

input {
  font-size: 20px;
  padding: 15px;
  margin-bottom: 50px;
}
#result-2 {
    color: red;
}
</style>
<body>
     <button onclick="chooseToggle('.button-1');" class="game-button button-1">Gaming</button>
     <button onclick="chooseToggle('.button-2');" class="game-button button-2">Music</button>
     <button onclick="chooseToggle('.button-3');" class="game-button button-3">Tech</button>

       <div>
     <input class="search-bar" type="text" id="orderCost" placeholder="Cost of Order">
    <button id="calculate-button"  onclick="calculateTotal();
    ">Calculate</button>
     <p id="result"></p>
       <p id="result-2"></p>
  </div>
    <script>
 //const button= document.querySelector('.js-button');
 //button.classList.contains('js-button'); 
 //console.log(button);
  function chooseToggle (selector) {
   const button= document.querySelector(selector);
 if(!button.classList.contains('is-toggled')) {
     turnOffPreviousButton();
    button.classList.add('is-toggled'); 
 }else {
    button.classList.remove('is-toggled');
 }

 function turnOffPreviousButton() {
  const previousButton = document.querySelector('.is-toggled');
  if (previousButton) {
    previousButton.classList.remove('is-toggled');
  }
  }
}
 
   function calculateTotal() {
    let orderCost = Number(document.getElementById("orderCost").value);
    let totalCost;
  
    document.querySelector('#result').textContent='';
    document.querySelector('#result-2').textContent='';
 if(orderCost < 0) {
 document.getElementById('result-2').textContent= "Error: cost cannot be lesser than 0";
 return;
} 
     

    if (orderCost >= 40) {
        totalCost = orderCost;
    } else {
        totalCost = orderCost + 10;
    }
   document.getElementById("result").textContent =
        `Total Cost: $${totalCost}`;
  

}

    </script>
</body>
</html>
