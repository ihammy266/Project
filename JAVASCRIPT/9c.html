<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="9c.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <button> <img src="../styles/icons/rock-emoji.png" onclick="playerGame('rock');
    ">
    </button>

    <button>
        <img src="../styles/icons/paper-emoji.png" onclick=" playerGame('paper');">
    </button>
    <button>
        <img src="../styles/icons/scissors-emoji.png" alt="scissors image" onclick=" playerGame('scissors');">
    </button>

    <p id="result"></p>
    <p id="js-moves"></p>
    <p onclick="playerGame()" id="score">Wins:0 , Losses :0, Tie:0</p>

    <button id="Reset" onclick="
      resetScore();
        ">Reset Score</button>
        
        <button id="js-auto-play-button">Auto Play</button>

    <script src="app.js"></script>
</body>

</html>
